spring:
  application:
    name: iah-nutrition-rest
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

iah:
  nutrition:
    schema: IAHNUTR
    default-batch-kg: 1000
    data:
      base-url: ${IAH_DATA_BASE_URL:http://127.0.0.1:{port}/data}
    optimizer:
      max-iterations: 20000
      nonlinear-population: 40
      nonlinear-max-evaluations: 20000
      constraint-penalty: 1000000
      ratio-penalty: 250
      quadratic-mix-penalty: 0.15
