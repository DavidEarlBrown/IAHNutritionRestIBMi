# IAH Nutrition RPG CGI data API
# Map /iahdata/* to IAHRSTD. Listen on port 10010 or reuse the existing HTTP server.

Listen 10010
<VirtualHost *:10010>
    ServerName iah-nutrition-data
    ScriptAlias /iahdata /qsys.lib/iahnutsrc.lib/iahrstd.pgm
    <Directory /qsys.lib/iahnutsrc.lib>
        Require all granted
        Options +ExecCGI
    </Directory>
</VirtualHost>
